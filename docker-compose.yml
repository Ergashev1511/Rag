name: rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rag]

  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [rag]

  # Bucket ni bir marta yaratadi (mavjud bo'lsa o'tkazib yuboradi) va to'xtaydi.
  minio-init:
    image: ${MINIO_MC_IMAGE:-pgsty/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "
    networks: [rag]

  # Embedding (bge-m3) va keyinchalik lokal Qwen uchun. Faqat "ollama" profili yoqilganda ishga tushadi
  # (.env: COMPOSE_PROFILES=ollama). Ollama hostda ishlasa profil yoqilmaydi, EMBEDDING_BASE_URL hostga qaratiladi.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [ollama]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [rag]

  api:
    image: ${API_IMAGE:-rag-api:latest}
    build:
      context: .
      dockerfile: src/Rag.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__MigrateOnStartup: ${DB_MIGRATE_ON_STARTUP:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Rag__Retrieval__Hybrid: ${RAG_HYBRID_SEARCH:-false}
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET}
      Minio__UseSsl: "false"
      Embedding__BaseUrl: ${EMBEDDING_BASE_URL:-http://ollama:11434}
      Embedding__Model: ${EMBEDDING_MODEL:-bge-m3}
      Embedding__Dimensions: ${EMBEDDING_DIMENSIONS:-1024}
      Llm__BaseUrl: ${LLM_BASE_URL}
      Llm__ApiKey: ${LLM_API_KEY}
      Llm__Model: ${LLM_MODEL}
      Llm__Temperature: ${LLM_TEMPERATURE:-0.2}
      Security__AdminApiKey: ${ADMIN_API_KEY}
      Security__ChatRequestsPerMinute: ${CHAT_REQUESTS_PER_MINUTE:-20}
    ports:
      - "${API_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/live HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \" 200 \" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [rag]

networks:
  rag:

volumes:
  pgdata:
  miniodata:
  ollama:
